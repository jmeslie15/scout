[project]
name = "scout-api"
version = "0.1.0"
description = "Control-plane HTTP API: webhooks, jobs, questions, approvals, dashboard queries."
requires-python = ">=3.12"
dependencies = [
    "scout-agents",
    "scout-domain",
    "scout-persistence",
    "scout-observability",
    "scout-github",
    "scout-notifications",
    "scout-knowledge",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_api"]

[tool.uv.sources]
scout-agents = { workspace = true }
scout-domain = { workspace = true }
scout-github = { workspace = true }
scout-knowledge = { workspace = true }
scout-notifications = { workspace = true }
scout-observability = { workspace = true }
scout-persistence = { workspace = true }
