[project]
name = "scout-worker"
version = "0.1.0"
description = "Disposable execution plane: checkout, sandboxed tools, agent invocation, artifacts."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-persistence",
    "scout-observability",
    "scout-github",
    "scout-sandbox",
    "scout-tools",
    "scout-llm",
    "scout-agents",
    "scout-knowledge",
    "scout-orchestrator",
    "redis>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_worker"]

[tool.uv.sources]
scout-orchestrator = { workspace = true }
scout-agents = { workspace = true }
scout-domain = { workspace = true }
scout-github = { workspace = true }
scout-knowledge = { workspace = true }
scout-llm = { workspace = true }
scout-observability = { workspace = true }
scout-persistence = { workspace = true }
scout-sandbox = { workspace = true }
scout-tools = { workspace = true }
