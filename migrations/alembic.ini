# =============================================================================
# Alembic configuration for Scout.
#
# Run from the repository root:
#   uv run alembic -c migrations/alembic.ini upgrade head
#   uv run alembic -c migrations/alembic.ini check
#
# There is deliberately NO database URL in this file. The URL comes from the
# SCOUT_DATABASE_URL environment variable, read in `migrations/env.py`, so that
# no credential is ever committed and the same file works for a developer's
# localhost, CI, and a deployment.
# =============================================================================

[alembic]
# `%(here)s` is the directory containing this file, so the script location is
# correct regardless of which directory alembic is invoked from.
script_location = %(here)s

# `prepend_sys_path` puts the repository root on sys.path. `env.py` imports
# `scout_persistence` (and `scout_domain` through it); without this the entry
# point only works when the packages happen to be pip-installed.
prepend_sys_path = %(here)s/..

# Filenames and paths use the host separator (`/` on macOS and Linux).
path_separator = os

# The migration filename template. A date prefix plus the slug gives a
# chronological directory listing; the random suffix keeps two migrations
# generated in the same second from colliding.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timestamps written into a migration are UTC. A migration's revision timestamp
# ends up in the audit trail of every environment it is applied to, so it must
# not depend on the generating machine's timezone.
timezone = UTC

# `sqlalchemy.url` is intentionally unset: `env.py` reads SCOUT_DATABASE_URL and
# sets it at runtime. Leaving the key present but empty documents that this is a
# decision rather than an oversight.
sqlalchemy.url =

[post_write_hooks]
# Formatting hooks are not wired up here because `migrations/**` is excluded from
# the ruff gate in the root pyproject (see [tool.ruff] extend_exclude). A hook
# that is skipped by the project's own configuration would be misleading.

# -----------------------------------------------------------------------------
# Logging
#
# Alembic's own loggers are configured here so `alembic upgrade head` produces a
# readable record of what ran. The root logger is left alone: Scout's services
# configure their own handlers, and reaching into root from a migration run would
# hijack them.
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
