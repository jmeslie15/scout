[project]
name = "scout-github"
version = "0.1.0"
description = "GitHub App authentication, webhook verification/idempotency, PR payloads, check runs."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-observability",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_github"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-observability = { workspace = true }
