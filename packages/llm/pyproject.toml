[project]
name = "scout-llm"
version = "0.1.0"
description = "Provider-agnostic LLM gateway: routing, retries, prompt versioning, token/cost accounting."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-observability",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_llm"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-observability = { workspace = true }
