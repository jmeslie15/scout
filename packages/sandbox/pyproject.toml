[project]
name = "scout-sandbox"
version = "0.1.0"
description = "Isolated execution: workspace lifecycle, resource limits, network policy, command results."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_sandbox"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-observability = { workspace = true }
