[project]
name = "scout-domain"
version = "0.1.0"
description = "Pure domain layer: identifiers, job state machine, findings, evidence, risk, repository config. No I/O."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_domain"]
