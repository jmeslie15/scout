[project]
name = "scout-agents"
version = "0.1.0"
description = "Reasoning agents with explicit context/result contracts and capability scoping."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-llm",
    "scout-knowledge",
    "scout-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_agents"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-knowledge = { workspace = true }
scout-llm = { workspace = true }
scout-observability = { workspace = true }
