[project]
name = "scout-knowledge"
version = "0.1.0"
description = "Engineering memory: knowledge documents, decisions, authority ranking, retrieval."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_knowledge"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-persistence = { workspace = true }
