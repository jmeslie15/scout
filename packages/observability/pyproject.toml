[project]
name = "scout-observability"
version = "0.1.0"
description = "Structured logging, correlation context, and OpenTelemetry wiring shared by every process."
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_observability"]
