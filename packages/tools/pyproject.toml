[project]
name = "scout-tools"
version = "0.1.0"
description = "Deterministic engineering tool framework: registry, contracts, artifact capture."
requires-python = ">=3.12"
dependencies = [
    "scout-domain",
    "scout-sandbox",
    "scout-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_tools"]

[tool.uv.sources]
scout-domain = { workspace = true }
scout-observability = { workspace = true }
scout-sandbox = { workspace = true }
